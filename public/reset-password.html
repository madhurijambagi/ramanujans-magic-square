<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &middot; SquareVerse</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-brand"><span class="glyph">15</span> SquareVerse</div>
  <div class="nav-links"><a href="/">Back to log in</a></div>
</nav>

<div class="container-narrow">
  <div class="card">
    <h2>Choose a new password</h2>
    <form id="reset-form">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
      <p style="color:var(--muted); font-size:0.78rem;">At least 8 characters.</p>
      <button class="btn btn-block" type="submit">Update password</button>
      <div class="form-error" id="reset-message"></div>
    </form>
  </div>
</div>

<footer>SquareVerse &mdash; a universe of magic-square puzzles.</footer>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const form = document.getElementById("reset-form");
const message = document.getElementById("reset-message");

if (!token) {
  form.style.display = "none";
  message.style.color = "var(--red)";
  message.textContent = "This link is missing its reset token. Request a new one from the login page.";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "";
  try {
    await api.post("/api/auth/reset-password", {
      token,
      new_password: document.getElementById("new-password").value,
    });
    message.style.color = "var(--teal)";
    message.textContent = "Password updated. Redirecting to log in…";
    setTimeout(() => { window.location.href = "/"; }, 1500);
  } catch (err) {
    message.style.color = "var(--red)";
    message.textContent = err.message;
  }
});
</script>
<script src="/js/theme.js"></script>
<script src="/js/companion.js"></script>
</body>
</html>
