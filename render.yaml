services:
  - type: web
    name: ramanujans-magic-square
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: ramanujans-magic-square-data
      mountPath: /var/data
      sizeGB: 1
